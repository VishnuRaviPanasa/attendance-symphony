# Deploy the attendance app to GitHub Pages.
#
# The last step of the pipeline: ticket → agent → verified → PR → merged → **deployed**.
#
# Deployment is gated on the tests. `deploy` needs `verify`, so a merge that breaks the suite or
# leaves index.html malformed never reaches the live site — the same gate the orchestrator
# applies to an agent's work, applied once more before the public sees it.
#
# ONE-TIME SETUP (required — a workflow cannot do this for you):
#   Settings → Pages → Build and deployment → Source: **GitHub Actions**
# Until that is set, the `configure-pages` step fails with "Get Pages site failed" and nothing
# is published. Afterwards every green merge deploys automatically.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one deployment at a time; let a newer commit supersede an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  verify:
    name: Verify before shipping
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: index.html and app.html are in sync
        run: node scripts/sync-app-html.js --check

      - name: App is structurally intact
        run: node scripts/check-app.mjs

      - name: Attendance API tests and route conflicts
        working-directory: attendance-api
        run: npm ci && npm run verify

  build:
    name: Build site
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Assemble the published site
        run: |
          mkdir -p site
          cp index.html site/index.html
          cp spec-kit-vs-symphony.html site/symphony-vs-speckit.html
          cp -r _shots site/_shots
          # Pages serves Jekyll by default, which would ignore _shots (leading underscore).
          touch site/.nojekyll
          {
            echo "Deployed from ${GITHUB_SHA} on $(date -u +'%Y-%m-%d %H:%M UTC')"
          } > site/BUILD.txt
          ls -la site

      # NB: `enablement: true` was tried here and fails — turning Pages on requires repo-admin
      # rights that the default GITHUB_TOKEN does not have. Pages must be switched on once by
      # hand: Settings → Pages → Build and deployment → Source: GitHub Actions. Everything
      # after that is automatic.
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
